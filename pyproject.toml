[project]
name = "benke-article-main-code"
version = "0.1.0"
description = "Configurable HMM market timing research and portfolio backtesting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hmmlearn>=0.3.3,<0.4",
    # hmmlearn 0.3.3 uses array.shape assignment deprecated in NumPy 2.5.
    "numpy>=2.3.1,<2.5",
    "pandas>=2.2.3,<3",
    "pydantic>=2.11.3,<3",
    "pydantic-settings>=2.8.1,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.16,<2",
]

[project.optional-dependencies]
portfolio = ["backtrader==1.9.78.123"]
plots = ["matplotlib>=3.10.1,<4"]
notebooks = ["ipykernel>=6.29.5,<8"]

[project.scripts]
benke = "benke.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benke"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/configs", "/docs", "/README.md", "/main.py", "/pyproject.toml", "/uv.lock", "/.python-version"]
exclude = ["**/__pycache__", "**/*.pyc"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
